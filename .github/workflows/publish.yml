name: Publish Package 📦 to npm (Trusted Publishing OIDC)

# Triggered by pushing a release tag (e.g. `git push origin v1.0.1`).
# The tag must be created on a commit that is already on `main`, otherwise the
# `build_and_test` job fails before anything is published.
on:
  push:
    tags:
      - "v*"

# Least privilege at the workflow root; `id-token: write` (npm OIDC) and
# `contents: write` (GitHub Release) are granted only to the jobs that need them.
permissions:
  contents: read

# A re-pushed tag or a double-clicked re-run must not publish the same version twice.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_test:
    name: Verify tag, lint, and run full layout test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history is needed for the branch ancestry check
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify the tag is a semantic version (`vX.Y.Z`)
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not of the form vX.Y.Z. Aborting release."
            exit 1
          fi
      - name: Verify the tagged commit is on the default branch
        run: |
          # `fetch-depth: 0` normally already fetched origin/main; only fall back to
          # an explicit fetch when it is missing.
          if ! git rev-parse --verify -q refs/remotes/origin/main >/dev/null; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main || true
          fi
          if ! git rev-parse --verify -q refs/remotes/origin/main >/dev/null; then
            echo "::warning::Could not resolve origin/main; skipping ancestry check."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            echo "::error::Merge the release commit into main first, then tag it. Nothing was published."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is on main ✔"
      - name: Verify git tag matches package.json and library version
        run: |
          node -e '
            const pkg = require("./package.json");
            const lib = require("./src/index.js");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (tag !== pkg.version || tag !== lib.VERSION) {
              console.error(`Tag ${tag} does not match package.json (${pkg.version}) / src (${lib.VERSION})`);
              process.exit(1);
            }
            console.log(`Verified release version ${tag}`);
          '
      - name: Run static checks, unit tests, and layout-integrity tests
        run: npm run check
      - name: Run sample site end-to-end demo
        run: npm run demo
      - name: Verify tarball contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm via OIDC Trusted Publisher
    needs: build_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing & automatic provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure latest npm CLI with OIDC Trusted Publishing support
        run: npm install -g npm@latest
      - name: Publish via OIDC (no NPM_TOKEN required; provenance is automatic)
        run: npm publish --access public
      - name: Summarise the published package
        run: |
          {
            echo "### Published 📦"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`$(node -p 'require("./package.json").name')\` |"
            echo "| Version | \`$(node -p 'require("./package.json").version')\` |"
            echo "| Tag | \`$GITHUB_REF_NAME\` |"
            echo "| npm | https://www.npmjs.com/package/tailclass/v/$(node -p 'require("./package.json").version') |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to create the release/tag notes
    steps:
      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving it untouched."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TailClass $GITHUB_REF_NAME" \
            --generate-notes
      - name: Summarise the release
        run: |
          {
            echo "### Release 🏷️"
            echo ""
            echo "GitHub Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
