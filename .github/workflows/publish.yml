name: Publish Package 📦 to npm

on:
  push:
    tags:
      - "v*"

# Least privilege at the workflow root; id-token: write is granted only to the publish job.
permissions:
  contents: read

jobs:
  build_and_test:
    name: Verify tag, lint, and run full layout test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify git tag matches package.json and library version
        run: |
          node -e '
            const pkg = require("./package.json");
            const lib = require("./src/index.js");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (tag !== pkg.version || tag !== lib.VERSION) {
              console.error(`Tag ${tag} does not match package.json (${pkg.version}) / src (${lib.VERSION})`);
              process.exit(1);
            }
            console.log(`Verified release version ${tag}`);
          '
      - name: Run static checks, unit tests, and layout-integrity tests
        run: npm run check
      - name: Run sample site end-to-end demo
        run: npm run demo
      - name: Verify tarball contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm with Verified Provenance
    needs: build_and_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish unscoped package with Sigstore provenance attestation
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
