<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Infinitode Cloud — Contact</title>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">
  <nav class="sticky top-0 z-50 flex items-center justify-between border-b border-slate-200 bg-white/90 px-6 py-4 backdrop-blur">
    <a href="/" class="text-xl font-bold tracking-tight text-slate-900">Infinitode</a>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <section class="py-12">
      <h2 class="text-3xl font-bold tracking-tight text-slate-900">Get in Touch</h2>
      <form class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <div>
          <label class="block text-sm font-medium text-slate-700">Full Name</label>
          <input type="text" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-slate-700">Work Email</label>
          <input type="email" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="mt-6">
          <button type="submit" class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500">
            Send Message
          </button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
